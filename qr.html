<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR del cotizador | futsala.co</title>
<style>
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0a0a0c;color:#f5f5f7;font-family:system-ui,sans-serif;padding:16px}
.box{text-align:center;max-width:420px;width:100%}
input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1.5px solid #2a2a32;background:#141418;color:#fff;font-size:1rem}
#qr{background:#fff;padding:18px;border-radius:18px;display:inline-block;margin:20px 0}
button{padding:12px 22px;border-radius:999px;border:0;background:#ffc21a;font-weight:700;cursor:pointer}
p{color:#a2a2ad;font-size:.9rem}
</style></head><body>
<div class="box">
  <h2>QR del cotizador</h2>
  <p>Pega el link donde publiques el cotizador (ej: https://futsala.co/cotizar).</p>
  <input id="url" placeholder="https://..." value="">
  <div><div id="qr"></div></div>
  <div><button id="dl">Descargar PNG</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const input=document.getElementById('url'), box=document.getElementById('qr');
input.value = location.protocol.startsWith('http') ? location.href.replace(/qr\.html.*$/,'') : '';
let qr;
function draw(){ box.innerHTML=''; if(!input.value) return;
  qr=new QRCode(box,{text:input.value,width:280,height:280,correctLevel:QRCode.CorrectLevel.H}); }
input.addEventListener('input',draw); draw();
document.getElementById('dl').onclick=()=>{
  const c=box.querySelector('canvas'); if(!c) return;
  const a=document.createElement('a'); a.download='qr-cotizador-futsala.png'; a.href=c.toDataURL('image/png'); a.click();
};
</script></body></html>
